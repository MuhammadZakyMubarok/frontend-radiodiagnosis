apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: frontend-radiodiagnosis-ingress
  namespace: radiodiagnosis
  annotations:
    cert-manager.io/cluster-issuer: letsencrypt-prod
spec:
  ingressClassName: nginx
  tls:
    - hosts:
        - radiodiagnosis.id
      secretName: frontend-tls
  rules:
    - host: radiodiagnosis.id
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: frontend
                port:
                  number: 80